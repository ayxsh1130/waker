name: autopilot
services:
  init-secrets:
    image: python:3.12-slim
    user: 0:0
    command:
    - python
    - /init_secrets.py
    volumes:
    - control-secrets:/run/autopilot
    - ./services/init_secrets.py:/init_secrets.py:ro
    restart: 'no'
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: autopilot
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U autopilot -d autopilot
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: autopilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
    - alembic
    - upgrade
    - head
    environment: {}
    volumes:
    - control-secrets:/run/autopilot:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    env_file:
    - .env
  test-dependency:
    image: autopilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
    - uvicorn
    - main:app
    - --app-dir
    - /services/test-dependency
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    environment: {}
    volumes:
    - control-secrets:/run/autopilot:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  broker-proxy:
    image: autopilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
    - uvicorn
    - main:app
    - --app-dir
    - /services/broker-proxy
    - --host
    - 0.0.0.0
    - --port
    - '8474'
    environment: {}
    volumes:
    - control-secrets:/run/autopilot:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8474/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  worker:
    image: autopilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
    - celery
    - -A
    - app.workers.celery_app:celery_app
    - worker
    - -n
    - default@autopilot
    - -Q
    - default
    - --concurrency=2
    - --loglevel=INFO
    - --heartbeat-interval=2
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://autopilot:change_me_local_only@postgres:5432/autopilot}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_TOKEN_FILE: /run/autopilot/control_token
      DEPENDENCY_URL: http://test-dependency:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
    - control-secrets:/run/autopilot:ro
    - task-artifacts:/data/artifacts
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      test-dependency:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  worker-control:
    image: autopilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
    - uvicorn
    - main:app
    - --app-dir
    - /services/worker-control
    - --host
    - 0.0.0.0
    - --port
    - '8090'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://autopilot:change_me_local_only@postgres:5432/autopilot}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_TOKEN_FILE: /run/autopilot/control_token
      DEPENDENCY_URL: http://test-dependency:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CELERY_BROKER_URL: redis://broker-proxy:16379/0
    volumes:
    - control-secrets:/run/autopilot:ro
    - task-artifacts:/data/artifacts
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker-proxy:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      test-dependency:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  backend:
    image: autopilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment: {}
    volumes:
    - control-secrets:/run/autopilot:ro
    - ./backend/app/workers:/source/workers:ro
    - task-artifacts:/data/artifacts
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      test-dependency:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    env_file:
    - .env
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 127.0.0.1:8000:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  control:
    image: autopilot-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command:
    - python
    - -m
    - app.control
    environment: {}
    volumes:
    - control-secrets:/run/autopilot:ro
    - ./backend/app/workers:/source/workers:ro
    - task-artifacts:/data/artifacts
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      test-dependency:
        condition: service_healthy
      worker-control:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    env_file:
    - .env
    extra_hosts:
    - host.docker.internal:host-gateway
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
    - 127.0.0.1:5173:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
    - chroma-data:/data/chroma
    - embedding-models:/models
    - control-secrets:/run/autopilot:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
    - 127.0.0.1:8025:8025
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=7d
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    ports:
    - 127.0.0.1:9090:9090
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana_local}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana-data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
    - prometheus
    restart: unless-stopped
  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
    - 127.0.0.1:16686:16686
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./monitoring/otel.yml:/etc/otelcol/config.yaml:ro
    depends_on:
    - jaeger
    restart: unless-stopped
volumes:
  control-secrets: {}
  postgres-data: {}
  redis-data: {}
  chroma-data: {}
  embedding-models: {}
  task-artifacts: {}
  prometheus-data: {}
  grafana-data: {}
